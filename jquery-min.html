<!DOCTYPE html>
<html>
    <head>
        <script src = "./jquery-min.js"></script>
    </head>
    <style>
        .description{
            display: none;
        }
        .accordion{
            background-color : black;
            color : aliceblue;
            width : 200px
        }
    </style>
    <body>
        <form id = "myform">
            <h1>jQuery Practie</h1>
            <input name = "name" type = "text" id = "txt1">
            <input name = "email" type = "email" id = "txt2">
            <button type = "submit" id = "btn1">Click Me</button>
        </form>
        <p id = "p1">This is a paragraph.</p>
        <p>Simple Accordion</p>
        <div class = "accordion">
            <div class = "header">Title</div>
            <div class = "description">This is the description for the accordion.</div>
        </div>
        <script>
            $(document).ready(function(){
                //showing the according description
                $('.header').click(function () {
                    $('.description').slideDown()
                    $('.description').slideToggle()
                })
                $("#btn1").mouseenter(function(){
                    $("#p1").show();
                });
                $("#btn1").mouseleave(function(){
                    $("#p1").hide();
                });
                $("#txt1").keyup(function(){
                    $("#p1").text($(this).val());
                });
                $("#myform").submit(function(){
                    alert("form submit")
                })
            });
        </script>
    </body>
</html>
